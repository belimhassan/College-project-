<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow - Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="dashboard">

        <h1>My To-Do List</h1>

        <p id="welcomeMessage">
            Welcome!
        </p>

        <button id="logoutBtn">
            Logout
        </button>

        <hr>

        <h2>Tasks</h2>

        <div class="task-input">

           <div class="task-input-area">

    <input
        type="text"
        id="taskInput"
        placeholder="Enter your task"
    >

    <select id="taskDuration">
          <option value="120" selected> Timing</option>
         <option value="120">5 Minutes</option>
        <option value="15">15 Minutes</option>
        <option value="30">30 Minutes</option>
         <option value="120">45 Minutes</option>
        <option value="60">1 Hour</option>
        <option value="120">2 Hours</option>
         <option value="120">5 Hours</option>
         <option value="120">8 Hours</option>
         <option value="120">10 Hours</option>
         <option value="120">12 Hours</option>
         <option value="120">15 Hours</option>
         <option value="120">18 Hours</option>
         <option value="120">20 Hours</option>
         <option value="120">22 Hours</option>
         <option value="120">24 Hours</option>
    </select>

    <button
        type="button"
        id="addTaskBtn"
        class="add-task-btn"
    >
        Add Task
</button>


        </div>

        <ul id="taskList"></ul>

    </div>

    <script src="script.js"></script>

</body>
