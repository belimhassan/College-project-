

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow - Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="dashboard">

        <h1>My To-Do List</h1>

        <p id="welcomeMessage">
            Welcome!
        </p>

        <button id="logoutBtn">
            Logout
        </button>

        <hr>

        <h2>Tasks</h2>

        <div class="task-input">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter your task"
            >

            <button id="addTaskBtn">
                Add Task
            </button>

        </div>

        <ul id="taskList"></ul>

    </div>

    <script src="script.js"></script>

</body>
