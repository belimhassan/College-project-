<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow - Register</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #ffffff;
            font-family: Arial, sans-serif;
        }

        .auth-card {
            width: 100%;
            max-width: 380px;
            padding: 30px;

            background: #ffffff;
            color: #000000;

            border: 3px solid #000000;
            border-radius: 10px;
        }

        h1 {
            margin: 0 0 25px;
            text-align: center;
            color: #000000;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 9px 10px;
            margin-bottom: 15px;

            border: 1px solid #cccccc;
            border-radius: 5px;

            font-size: 15px;
        }

        input[type="submit"] {
            width: 100%;
            padding: 10px;

            background: linear-gradient(to right, rgb(0, 195, 255), purple);
            color: #ffffff;

            border: none;
            border-radius: 5px;

            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        input:focus-visible {
            outline: 2px solid #2563eb;
            outline-offset: 1px;
        }

        .switch {
            margin: 22px 0 0;
            text-align: center;
            font-size: 16px;
            color: darkblue;
        }

        .switch a {
            font-weight: bold;
        }
    </style>
</head>

<body>

    <main class="auth-card">

        <form id="registerForm">

            <h1>Register Now</h1>

            <label for="name">Name:</label>
            <input type="text" id="name" placeholder="Enter your full name" autocomplete="name" required>

            <label for="username">Username:</label>
            <input type="text" id="username" placeholder="Enter your username" autocomplete="username" required>

            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="Enter your email" autocomplete="email" required>

            <label for="password">Password:</label>
            <input type="password" id="password" placeholder="Enter your password (min 6 characters)" autocomplete="new-password" maxlength="32" required>

            <label for="confirm">Confirm Password:</label>
            <input type="password" id="confirm" placeholder="Enter your password again" autocomplete="new-password" maxlength="32" required>

            <input type="submit" value="Sign up">

            <p class="switch">
                Already have an account?
                <a href="index.html">Login</a>
            </p>

        </form>

    </main>

    <script src="script.js" charset="UTF-8"></script>

</body>

</html>
