<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow - Register</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;

            background: white;

            font-family: Arial, sans-serif;
        }

        .register-box {
            width: 100%;
            max-width: 380px;

            margin: 30px auto;
            padding: 30px;

            background-color: white;
            color: black;

            border: 3px solid black;
            border-radius: 10px;
        }

        .register-box h1 {
            margin-top: 0;

            color: black;
            text-align: center;
        }

        .register-box label {
            display: block;

            margin-bottom: 5px;

            font-weight: bold;
        }

        .register-box input[type="text"],
        .register-box input[type="email"],
        .register-box input[type="password"] {
            width: 100%;

            margin: 0 0 15px;
            padding: 8px;

            border: 1px solid #cccccc;
            border-radius: 5px;
        }

        .register-box input[type="submit"] {
            width: 100%;
            padding: 8px;

            background: linear-gradient(to right, rgb(0, 195, 255), purple);
            color: white;

            border: none;
            border-radius: 2px;

            cursor: pointer;
        }

        .switch-text {
            margin: 20px 0 0;

            color: darkblue;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <form id="registerForm">

        <div class="register-box">

            <h1>Register Now</h1>

            <label for="name">Name:</label>
            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                maxlength="100"
                autocomplete="name"
                required
            >

            <label for="username">Username:</label>
            <input
                type="text"
                id="username"
                placeholder="Enter your username"
                minlength="3"
                maxlength="50"
                pattern="[A-Za-z0-9_.]+"
                title="Letters, numbers, _ and . only"
                autocomplete="username"
                required
            >

            <label for="email">Email:</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                maxlength="100"
                autocomplete="email"
                required
            >

            <label for="password">Password:</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                minlength="6"
                maxlength="32"
                autocomplete="new-password"
                required
            >

            <label for="confirm">Confirm Password:</label>
            <input
                type="password"
                id="confirm"
                placeholder="Enter your password again"
                minlength="6"
                maxlength="32"
                autocomplete="new-password"
                required
            >

            <input type="submit" value="Sign up">

            <p class="switch-text">
                Already have an account?
                <a href="index.html">Login</a>
            </p>

        </div>

    </form>

    <script src="script.js" charset="UTF-8"></script>

</body>

</html>
